plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

mixin {
    add sourceSets.main, 'mixins.workers_ore_compat.refmap.json'
    config 'mixins.workers_ore_compat.json'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Workers & Recruits
    implementation fg.deobf("blank:workers-1.20.1:2.0.3")
    implementation fg.deobf("blank:recruits-1.20.1:1.20.1")

    // Ore Mods
    runtimeOnly fg.deobf("blank:create:1.20.1")
    runtimeOnly fg.deobf("blank:geolosys:7.0.14")
    runtimeOnly fg.deobf("blank:mekanism:10.4.16")
    runtimeOnly fg.deobf("blank:appliedenergistics2-15.2.16:1.0")
    runtimeOnly fg.deobf("blank:powah:5.0.11")
    runtimeOnly fg.deobf("blank:extreme_reactors:1.20.1")
    runtimeOnly fg.deobf("blank:the_undergarden:0.8.14")
    runtimeOnly fg.deobf("blank:mystical_agriculture:7.0.24")
    runtimeOnly fg.deobf("blank:ad_astra:1.15.20")

    // Support Libs
    runtimeOnly fg.deobf("blank:architectury-9.2.14-forge:1.0")
    runtimeOnly fg.deobf("blank:botarium-forge-1.20.1:2.3.4")
    runtimeOnly fg.deobf("blank:cloth-config-11.1.136-forge:1.0")
    runtimeOnly fg.deobf("blank:Cucumber-1.20.1:7.0.16")
    runtimeOnly fg.deobf("blank:Patchouli-1.20.1-85-FORGE:1.0")
    runtimeOnly fg.deobf("blank:forbidden_arcanus-1.20.1:2.2.6")
    runtimeOnly fg.deobf("blank:resourcefulconfig-forge-1.20.1:2.1.3")
    runtimeOnly fg.deobf("blank:resourcefullib-forge-1.20.1:2.1.29")
    runtimeOnly fg.deobf("blank:valhelsia_core-forge-1.20.1:1.1.2")
    runtimeOnly fg.deobf("blank:ZeroCore2-1.20.1:2.1.45")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'mixins.workers_ore_compat.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
